# One command: docker compose up --build
# Works without a .env file (demo defaults). Copy .env.example to .env to change anything.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powerprocurement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-powerprocurement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerprocurement}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI: every outgoing demo email lands here
    # SMTP on 1025 stays inside the compose network on purpose

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-powerprocurement}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-powerprocurement}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAIL_REAL_SEND_ENABLED: ${MAIL_REAL_SEND_ENABLED:-false}
      MAIL_ALLOWED_RECIPIENTS: ${MAIL_ALLOWED_RECIPIENTS:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      FX_SOURCE: ${FX_SOURCE:-manual}
    volumes:
      - appdata:/app/data # key that encrypts API keys entered in the Settings tab
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "3000:3000"

volumes:
  pgdata:
  appdata:
