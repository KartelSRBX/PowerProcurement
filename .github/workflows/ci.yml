name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: powerprocurement
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: powerprocurement
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U powerprocurement" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://powerprocurement:ci@localhost:5432/powerprocurement
      AI_PROVIDER: mock # CI never calls the live Claude API; it replays recorded answers
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8000/health/ready
      - run: curl -fsS http://localhost:3000 | grep -q "PowerProcurement"
      - if: failure()
        run: docker compose logs
